name: Feature request
description: Suggest something that would help you use napi.
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and what is missing?
    validations:
      required: true
  - type: textarea
    id: what-would-help
    attributes:
      label: What would help?
      description: Describe the behavior you would like, or share an example of how you would use the API.
