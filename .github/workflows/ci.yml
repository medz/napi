name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_BASE_SHA: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.event.before) || '' }}
      CI_TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: scope
        run: |
          docs_only=$(bash tool/ci_scope.sh "$CI_EVENT_NAME" "$CI_BASE_SHA" "$CI_TARGET_SHA")
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
      - name: Check documentation changes
        if: steps.scope.outputs.docs_only == 'true'
        run: git diff --check "$CI_BASE_SHA" "$CI_TARGET_SHA" --
      - name: Test CI scope detection
        if: steps.scope.outputs.docs_only != 'true'
        run: bash tool/ci_scope_test.sh
      - uses: dart-lang/setup-dart@v1
        if: steps.scope.outputs.docs_only != 'true'
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: dart pub get
        if: steps.scope.outputs.docs_only != 'true'
      - run: dart format --output=none --set-exit-if-changed lib test tool
        if: steps.scope.outputs.docs_only != 'true'
      - run: dart analyze --fatal-infos
        if: steps.scope.outputs.docs_only != 'true'
      - run: dart test
        if: steps.scope.outputs.docs_only != 'true'
      - name: Install pinned fixture tools
        if: steps.scope.outputs.docs_only != 'true'
        run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2 @oven/bun-linux-x64@1.4.3
      - name: Verify packed Wasm ESM fixture in Node, Bun and TypeScript
        if: steps.scope.outputs.docs_only != 'true'
        env:
          NAPI_BUN: ${{ github.workspace }}/.dart_tool/js/node_modules/@oven/bun-linux-x64/bin/bun
          NAPI_TSC: ${{ github.workspace }}/.dart_tool/js/node_modules/.bin/tsc
        run: |
          dart --version
          node -p 'JSON.stringify({node: process.version, v8: process.versions.v8})'
          "$NAPI_BUN" --version
          "$NAPI_TSC" --version
          dart run tool/runtime_fixtures.dart
      - run: dart pub publish --dry-run
        if: steps.scope.outputs.docs_only != 'true'
