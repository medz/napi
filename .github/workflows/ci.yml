name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    name: Static and package checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: dart analyze --fatal-infos
      - run: dart run tool/check_package.dart
      - run: git diff --check HEAD^ HEAD

  tests:
    name: Dart tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - run: dart test

  wasm-runtime:
    name: Wasm runtime tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: dart test --platform node --compiler dart2wasm test/runtime/resources_test.dart test/runtime/streams_test.dart test/runtime/cancellation_test.dart

  consumers:
    name: Installed consumers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - run: dart run tool/verify.dart

  publication:
    name: Atomic publication (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart test test/compiler/publish_test.dart

  # Keep the existing required check name. Never turn a failed, skipped or
  # cancelled dependency into success merely because the gate itself ran.
  check:
    if: ${{ always() }}
    needs: [static, tests, wasm-runtime, consumers, publication]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          expected = {"static", "tests", "wasm-runtime", "consumers", "publication"}
          if set(results) != expected:
              sys.exit("Missing or unexpected validation jobs")
          failed = {name: job["result"] for name, job in results.items()
                    if job["result"] != "success"}
          if failed:
              sys.exit(f"Validation did not succeed: {failed}")
          print("All validation jobs succeeded.")
          PYTHON
