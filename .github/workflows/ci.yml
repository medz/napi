name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scope:
    name: Classify PR changes
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test scope classifier and required-check gate
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify complete PR change range
        id: classify
        run: python3 -B .github/scripts/ci_scope.py

  static:
    name: Static and package checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: dart analyze --fatal-infos
      - run: python3 -B -m unittest discover -s test/native -p '*_test.py'
      - run: dart run tool/check_package.dart
      - run: git diff --check HEAD^ HEAD

  tests:
    needs: scope
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.scope == 'full' }}
    name: Dart tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - run: dart test --total-shards 2 --shard-index ${{ matrix.shard }} --shard-by-suite
        env:
          NAPI_TEST_BROWSER: /usr/bin/google-chrome

  wasm-runtime:
    needs: scope
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.scope == 'full' }}
    name: Wasm runtime tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: dart test --platform node --compiler dart2wasm test/runtime/resources_test.dart test/runtime/streams_test.dart test/runtime/callback_stream_test.dart test/runtime/cancellation_test.dart

  consumers:
    needs: scope
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.scope == 'full' }}
    name: Installed consumers (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - run: dart test -P wasm-consumers --total-shards 2 --shard-index ${{ matrix.shard }} --shard-by-suite

  native:
    needs: scope
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.scope == 'full' }}
    name: Native consumers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
            runtimeBuild: xcodebuild/ProductX64
          - os: ubuntu-24.04
            platform: linux-x64-glibc
            runtimeBuild: out/ProductX64
          - os: ubuntu-24.04-arm
            platform: linux-arm64-glibc
            runtimeBuild: out/ProductARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - name: Identify native VM cache
        if: matrix.runtimeBuild != ''
        id: vm-cache-key
        run: echo "key=$(python3 tool/native/prepare_runtime.py --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore native VM objects and toolchain
        if: matrix.runtimeBuild != ''
        id: vm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/native-vm
          key: ${{ steps.vm-cache-key.outputs.key }}
      - name: Prepare native VM objects
        if: matrix.runtimeBuild != ''
        run: python3 tool/native/prepare_runtime.py --directory .dart_tool/native-vm
      - name: Save native VM objects and toolchain
        if: matrix.runtimeBuild != '' && steps.vm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/native-vm
          key: ${{ steps.vm-cache-key.outputs.key }}
      - name: Build native runtime from current sources
        if: matrix.runtimeBuild != ''
        run: |
          curl --fail --location --retry 2 --max-time 120 \
            'https://nodejs.org/dist/v24.19.0/node-v24.19.0-headers.tar.gz' \
            --output "$RUNNER_TEMP/node-headers.tar.gz"
          tar -xzf "$RUNNER_TEMP/node-headers.tar.gz" -C "$RUNNER_TEMP"
          python3 tool/native/build.py \
            --sdk .dart_tool/native-vm/sdk \
            --runtime-build .dart_tool/native-vm/sdk/${{ matrix.runtimeBuild }} \
            --node-headers "$RUNNER_TEMP/node-v24.19.0/include/node" \
            --output "$RUNNER_TEMP/native-bundle"
          echo "NAPI_TEST_NATIVE_RUNTIME=$RUNNER_TEMP/native-bundle" >> "$GITHUB_ENV"
      - name: Package native runtime artifact
        if: matrix.runtimeBuild != ''
        run: |
          python3 tool/native/bundle.py --dart "$(command -v dart)" pack \
            "$RUNNER_TEMP/native-bundle" \
            --archive "$RUNNER_TEMP/native-artifact/runtime.zip" \
            --lock "$RUNNER_TEMP/native-artifact/runtime.lock.json"
      - name: Upload native runtime artifact
        if: matrix.runtimeBuild != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-artifact
          if-no-files-found: error
          retention-days: 7
      - run: dart test -P native-consumers --fail-fast
      - name: Obtain runtime archive for download tests
        run: |
          cat > "$RUNNER_TEMP/runtime-url.dart" <<'DART'
          import 'package:napi/src/build/native_runtime.dart';
          void main() => print(nativeRuntimeArchive.url);
          DART
          url="$(dart --packages=.dart_tool/package_config.json "$RUNNER_TEMP/runtime-url.dart")"
          curl --fail --location --retry 2 --max-time 120 \
            "$url" --output "$RUNNER_TEMP/runtime.zip"
          echo "NAPI_TEST_RUNTIME_ARCHIVE=$RUNNER_TEMP/runtime.zip" >> "$GITHUB_ENV"
          echo "NAPI_RUNTIME_CACHE=$RUNNER_TEMP/napi-runtime" >> "$GITHUB_ENV"
      - run: dart test test/compiler/native_runtime_test.dart test/compiler/native_bundle_test.dart
      - name: Verify automatic runtime download
        if: matrix.runtimeBuild != ''
        run: |
          test ! -e "$NAPI_RUNTIME_CACHE"
          env -u NAPI_TEST_NATIVE_RUNTIME dart test test/consumers/native_test.dart \
            --plain-name 'Native installed package' --fail-fast
      - name: Build platform package input
        run: dart run test/support/fixtures/platform_packages.dart build-native "$RUNNER_TEMP/platform-module"
      - name: Upload platform package input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-module-${{ matrix.platform }}
          path: ${{ runner.temp }}/platform-module
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  platform-package:
    needs: [scope, native]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.scope == 'full' && needs.native.result == 'success' }}
    name: Cross-platform package (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-module-*
          path: ${{ runner.temp }}/platform-modules
      - name: Assemble one package from all native builds and Wasm
        run: |
          dart run test/support/fixtures/platform_packages.dart assemble \
            "$RUNNER_TEMP/platform-modules" "$RUNNER_TEMP/platform-package/fixture.tgz"
      - name: Consume the assembled package on Linux
        run: dart run test/support/fixtures/platform_packages.dart consume "$RUNNER_TEMP/platform-package/fixture.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-package
          path: |
            ${{ runner.temp }}/platform-package/fixture.tgz
            ${{ runner.temp }}/platform-package/packages/package
            ${{ runner.temp }}/platform-package/packages/macos-arm64
            ${{ runner.temp }}/platform-package/packages/macos-x64
            ${{ runner.temp }}/platform-package/packages/linux-x64-glibc
          if-no-files-found: error
          retention-days: 1

  platform-package-consumers:
    needs: [scope, platform-package]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.scope == 'full' && needs.platform-package.result == 'success' }}
    name: Cross-platform package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_26=" + process.execPath' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node -p '"NAPI_NODE_EXECUTABLES=" + JSON.stringify([process.execPath, process.env.NAPI_NODE_26])' >> "$GITHUB_ENV"
      - run: dart pub get
      - run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-package
          path: ${{ runner.temp }}/platform-package
      - name: Consume the same package without rebuilding
        run: dart run test/support/fixtures/platform_packages.dart consume "$RUNNER_TEMP/platform-package/fixture.tgz"

  publication:
    needs: scope
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.scope == 'full' }}
    name: Publication and rebuilds (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os != 'Linux'
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - name: Install TypeScript for the relocated Windows consumer
        if: runner.os == 'Windows'
        run: npm install --prefix .dart_tool/js --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - run: dart test test/compiler/publish_test.dart test/compiler/package_rebuild_test.dart test/compiler/module_rebuild_test.dart test/compiler/windows_rebuild_test.dart test/compiler/platform_package_test.dart
      - name: Test process ownership on macOS and Windows
        if: runner.os != 'Linux'
        run: dart test test/harness

  # Preserve the required check name. Only confirmed docs PRs may skip heavy
  # jobs; static/package checks and classifier regression tests always run.
  check:
    if: ${{ always() }}
    needs: [scope, static, tests, wasm-runtime, consumers, native, platform-package, platform-package-consumers, publication]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the exact validation results for this scope
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -B .github/scripts/ci_gate.py
