name: Native addons

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows_x64
          - os: windows-11-arm
            platform: windows_arm64
          - os: macos-15
            platform: macos_arm64
          - os: macos-15-intel
            platform: macos_x64
          - os: ubuntu-24.04
            platform: linux_x64
          - os: ubuntu-24.04-arm
            platform: linux_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install the TypeScript compiler
        run: |
          npm ci --prefix test/native --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the Dart package
        run: |
          dart pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format --output=none --set-exit-if-changed lib example test/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.platform }}' -eq 'linux_x64') {
            dart pub publish --dry-run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $archive = Join-Path $env:RUNNER_TEMP 'napi.tar.gz'
          dart pub publish --skip-validation "--to-archive=$archive"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build a fresh consumer and load all runtime profiles
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'napi-package'
          $smoke = Join-Path $env:RUNNER_TEMP 'napi smoke 中文'
          New-Item -ItemType Directory -Force $package, $smoke | Out-Null
          tar -xzf (Join-Path $env:RUNNER_TEMP 'napi.tar.gz') -C $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packagePath = $package.Replace('\', '/')
          @"
          name: napi_native_smoke
          environment:
            sdk: ^3.12.0
          dependencies:
            napi:
              path: '$packagePath'
          "@ | Set-Content "$smoke/pubspec.yaml"
          Copy-Item test/native/*.dart $smoke
          Copy-Item example/counter.dart (Join-Path $smoke 'package_counter.dart')
          Copy-Item experiments/native-image/payload.dart $smoke
          Copy-Item experiments/native-image/node_api.dart $smoke
          $output = Join-Path $smoke 'build'
          Push-Location $smoke
          try {
            dart pub get --offline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dart build.dart $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dart build_package.dart (Join-Path $smoke 'package_counter.dart') (Join-Path $output 'package')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $compilerAssets = Join-Path $package 'lib/src/compiler/assets'
            $unavailable = Join-Path $smoke 'sdk-unavailable'
            Move-Item -LiteralPath $compilerAssets -Destination $unavailable
            try {
              dart build_assembly.dart (Join-Path $output 'package/.napi.json') (Join-Path $output 'assembled')
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Move-Item -LiteralPath $unavailable -Destination $compilerAssets
            }
          } finally { Pop-Location }
          $images = Join-Path $smoke 'images'
          New-Item -ItemType Directory -Force $images | Out-Null
          $assets = Join-Path $package 'lib/src/compiler/assets/${{ matrix.platform }}'
          Copy-Item "$assets/runtime*.node" $images
          Copy-Item "$assets/NOTICES" $images
          Remove-Item -Recurse -Force $package
          node --expose-gc test/native/verify.cjs $output $images
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/native/verify_types.cjs $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix test/native run verify-package -- (Join-Path $output 'package')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix test/native run verify-package -- (Join-Path $output 'assembled')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($profile in 'core', 'regexp', 'full') {
            Push-Location (Join-Path $output $profile)
            try {
              $packed = npm pack --json --ignore-scripts --offline | Out-String | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $paths = @($packed[0].files | ForEach-Object { $_.path })
              if ($paths.Count -ne 3 -or 'addon.node' -notin $paths -or
                  'package.json' -notin $paths -or 'NOTICES' -notin $paths) {
                throw "Unexpected npm package files: $paths"
              }
              Write-Host "$profile npm: $($packed[0].size) bytes packed, $($packed[0].unpackedSize) bytes unpacked"
            } finally { Pop-Location }
          }

      - name: Upload the native package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: '${{ runner.temp }}/napi smoke 中文/build/package'
          include-hidden-files: true
          retention-days: 1

  verify-musl:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_x64_musl
            glibc: linux_x64
          - os: ubuntu-24.04-arm
            platform: linux_arm64_musl
            glibc: linux_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.glibc }}
          path: '${{ runner.temp }}/glibc'
      - name: Build and load musl addons in Alpine
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -v "$DART_HOME:/opt/dart:ro" \
            -v "$RUNNER_TEMP:/result" -w /workspace \
            -e NAPI_PLATFORM='${{ matrix.platform }}' \
            alpine:3.23 sh -euxc '
              apk add --no-cache gcompat libstdc++ nodejs npm
              export PATH=/opt/dart/bin:$PATH
              dart pub get
              npm ci --prefix test/native --ignore-scripts
              dart pub publish --skip-validation --to-archive=/tmp/napi.tar.gz
              mkdir /tmp/napi-package "/tmp/napi smoke 中文" /tmp/images
              tar -xzf /tmp/napi.tar.gz -C /tmp/napi-package
              smoke="/tmp/napi smoke 中文"
              printf "name: napi_native_smoke\nenvironment:\n  sdk: ^3.12.0\ndependencies:\n  napi:\n    path: /tmp/napi-package\n" > "$smoke/pubspec.yaml"
              cp test/native/*.dart "$smoke/"
              cp example/counter.dart "$smoke/package_counter.dart"
              cp experiments/native-image/payload.dart experiments/native-image/node_api.dart "$smoke/"
              cd "$smoke"
              dart pub get --offline
              dart build.dart /result/musl
              dart build_package.dart "$smoke/package_counter.dart" /result/musl/package
              mv /tmp/napi-package/lib/src/compiler/assets /tmp/sdk-unavailable
              dart build_assembly.dart /result/glibc/.napi.json /result/musl/package/.napi.json /result/musl/assembled
              cp /tmp/sdk-unavailable/$NAPI_PLATFORM/runtime*.node /tmp/sdk-unavailable/$NAPI_PLATFORM/NOTICES /tmp/images/
              rm -rf /tmp/napi-package /tmp/sdk-unavailable
              cd /workspace
              node --expose-gc test/native/verify.cjs /result/musl /tmp/images
              node test/native/verify_types.cjs /result/musl
              npm --prefix test/native run verify-package -- /result/musl/package
              npm --prefix test/native run verify-package -- /result/musl/assembled
            '
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: '${{ runner.temp }}/musl/package'
          include-hidden-files: true
          retention-days: 1
