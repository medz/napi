name: Windows native addon

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Check the Dart package
        run: |
          dart pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format --output=none --set-exit-if-changed lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart pub publish --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and load a native addon
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'napi-smoke'
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item experiments/native-image/payload.dart $smoke
          Copy-Item experiments/native-image/node_api.dart $smoke
          @'
          import 'dart:io';
          import 'package:napi/compiler.dart';
          Future<void> main(List<String> args) => Compiler([
            NativeTarget(entry: File(args[0]), output: File(args[1])),
          ]).run([]);
          '@ | Set-Content "$smoke/build.dart"
          dart --packages=.dart_tool/package_config.json "$smoke/build.dart" "$smoke/payload.dart" "$smoke/addon.node"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          const assert = require('node:assert/strict');
          const { join } = require('node:path');
          const { Worker } = require('node:worker_threads');
          const [path, directory] = process.argv.slice(2);
          const timeout = setTimeout(() => process.exit(1), 30000);
          async function main() {
            const addon = require(path);
            assert.equal(addon.answer, 42);
            assert.equal(addon.add(20, 22), 42);
            assert.equal(JSON.parse(addon.environment()).operatingSystem, 'windows');
            const file = join(directory, 'roundtrip.txt');
            assert.equal(await addon.fileRoundtrip(file, 'Dart 中文'), 'Dart 中文');
            assert.equal(await addon.isolateReadFile(file), 'Dart 中文');
            assert.equal(await addon.httpRoundtrip('hello'), 'Dart HTTP: hello');
            assert.equal(await addon.isolateRun(21), 42);
            assert.equal(await addon.isolateSpawn(21), 42);
            await Promise.all(Array.from({ length: 4 }, () => new Promise((resolve, reject) => {
              let result;
              const worker = new Worker(`
                const { parentPort, workerData } = require('node:worker_threads');
                const addon = require(workerData);
                addon.isolateRun(21).then(value => parentPort.postMessage(value));
              `, { eval: true, workerData: path });
              worker.on('message', value => { result = value; });
              worker.on('error', reject);
              worker.on('exit', code => {
                try {
                  assert.equal(code, 0);
                  assert.equal(result, 42);
                  resolve();
                } catch (error) { reject(error); }
              });
            })));
          }
          main().then(() => {
            clearTimeout(timeout);
            console.log('Native addon, dart:io, isolates and Workers passed.');
          }, error => { console.error(error); process.exit(1); });
          '@ | Set-Content "$smoke/verify.cjs"
          node "$smoke/verify.cjs" "$smoke/addon.node" $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
